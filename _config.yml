# Site-wide values, available to the templates as `site.*`.
title: Remoc
description: Remote multiplexed objects and channels for Rust.
url: https://remoc.rs
repo: https://github.com/remoc-rs/remoc
docs: https://docs.rs/remoc

# The projects sharing this site. The header switches between them and each page
# names the one it belongs to in its front matter as `project:`.
projects:
  - id: remoc
    name: Remoc
    url: /
    logo: /logo.png
    repo: https://github.com/remoc-rs/remoc
    branch: master
    crate: remoc
    changelog: https://github.com/remoc-rs/remoc/blob/master/CHANGELOG.md
    links:
      - { title: Features, url: "/#features" }
      - { title: Usage, url: "/#usage" }
      - { title: Benchmarks, url: /benchmarks.html }
      - { title: Docs, url: "https://docs.rs/remoc" }
      - { title: GitHub, url: "https://github.com/remoc-rs/remoc", icon: github }
  - id: postbag
    name: Postbag
    url: /postbag/
    logo: /postbag/logo.png
    repo: https://github.com/remoc-rs/postbag
    branch: main
    crate: postbag
    changelog: https://github.com/remoc-rs/postbag/blob/main/CHANGELOG.md
    links:
      - { title: Format, url: "/postbag/#format" }
      - { title: Compatibility, url: "/postbag/#compatibility" }
      - { title: Usage, url: "/postbag/#usage" }
      - { title: Wire format, url: "/postbag/#specifications" }
      - { title: Docs, url: "https://docs.rs/postbag" }
      - { title: GitHub, url: "https://github.com/remoc-rs/postbag", icon: github }
  - id: aggligator
    name: Aggligator
    url: /aggligator/
    logo: /aggligator/logo.png
    repo: https://github.com/remoc-rs/aggligator
    branch: master
    crate: aggligator
    # The workspace keeps one changelog per crate, so the footer needs to be told
    # which one is the project's.
    changelog: https://github.com/remoc-rs/aggligator/blob/master/aggligator/CHANGELOG.md
    links:
      - { title: Features, url: "/aggligator/#features" }
      - { title: Design, url: "/aggligator/#design" }
      - { title: Transports, url: "/aggligator/#transports" }
      - { title: Usage, url: "/aggligator/#usage" }
      - { title: Tools, url: "/aggligator/#tools" }
      - { title: Docs, url: "https://docs.rs/aggligator" }
      - { title: GitHub, url: "https://github.com/remoc-rs/aggligator", icon: github }

# GitHub Pages builds this with Jekyll; the layout and includes exist only to keep
# the shared chrome in one place. Nothing here is a blog, so no plugins are needed.
plugins: []

exclude:
  - README.md
  - icons/README.md
