# Site-wide values, available to the templates as `site.*`.
title: Remoc
description: Rust RPC with remote channels and objects over one connection.
url: https://remoc.rs
repo: https://github.com/remoc-rs/remoc
docs: https://docs.rs/remoc

# The projects sharing this site. The header switches between them and each page
# names the one it belongs to in its front matter as `project:`.
projects:
  - id: remoc
    name: Remoc
    summary: RPC and typed channels between Rust programs
    url: /
    logo: /logo.png
    social_image: /social/remoc.png
    social_image_alt: "Remoc: Rust RPC with remote channels and objects"
    repo: https://github.com/remoc-rs/remoc
    branch: master
    crate: remoc
    links:
      - { title: Examples, url: /examples/channels.html }
      - { title: Benchmarks, url: /benchmarks.html }
      - { title: Comparison, url: /comparison.html }
      - { title: Docs, url: "https://docs.rs/remoc" }
      - { title: GitHub, url: "https://github.com/remoc-rs/remoc", icon: github }
  - id: postbag
    name: Postbag
    summary: Binary Serde codec that survives schema changes
    url: /postbag/
    logo: /postbag/logo.png
    social_image: /social/postbag.png
    social_image_alt: "Postbag: compact binary Serde with built-in schema evolution"
    repo: https://github.com/remoc-rs/postbag
    branch: main
    crate: postbag
    links:
      - { title: Compatibility, url: "/postbag/#compatibility" }
      - { title: Recovery, url: "/postbag/#recoverable" }
      - { title: Docs, url: "https://docs.rs/postbag" }
      - { title: GitHub, url: "https://github.com/remoc-rs/postbag", icon: github }
  - id: aggligator
    name: Aggligator
    summary: Combines network links into one resilient connection
    url: /aggligator/
    logo: /aggligator/logo.png
    social_image: /social/aggligator.png
    social_image_alt: "Aggligator: many links, one resilient connection for Rust"
    repo: https://github.com/remoc-rs/aggligator
    branch: master
    crate: aggligator
    links:
      - { title: Transports, url: "/aggligator/#transports" }
      - { title: Tunnel, url: /aggligator/tunnel.html }
      - { title: Docs, url: "https://docs.rs/aggligator" }
      - { title: GitHub, url: "https://github.com/remoc-rs/aggligator", icon: github }

# The example programs. The pages under /examples/ switch between them with a tab bar,
# and each names the one it is with `example:` in its front matter.
examples:
  - { id: channels, name: Remote channels, url: /examples/channels.html }
  - { id: rtc, name: Remote trait calls, url: /examples/rtc.html }
  - { id: rtc-web, name: Web browser, url: /examples/rtc-web.html }

# GitHub Pages builds this with Jekyll; the layout and includes exist only to keep
# the shared chrome in one place. Nothing here is a blog, so no plugins are needed.
plugins: []

exclude:
  - README.md
  - icons/README.md
