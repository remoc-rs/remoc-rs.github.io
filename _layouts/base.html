<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="canonical" href="{{ site.url }}{{ page.canonical }}">
    <link rel="preload" href="/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/JetBrainsMono-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">

    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.canonical }}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.social_description | default: page.description }}">
    <meta property="og:image" content="{{ site.url }}/logo.png">
    <meta name="twitter:card" content="summary">
</head>

<body>
    <a class="skip" href="#content">Skip to content</a>

{{ content }}

    {% include footer.html %}
</body>

</html>
