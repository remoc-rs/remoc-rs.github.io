  <text x="407.0" y="219" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="var(--bg)">42</text>
  <text x="407.0" y="246" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="var(--accent)">_1</text>
  <rect x="454" y="198" width="34" height="32" rx="5" fill="var(--ty)"/>
  <text x="471.0" y="219" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="var(--bg)">04</text>
  <rect x="518" y="198" width="34" height="32" rx="5" fill="var(--str)"/>
  <text x="535.0" y="219" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="var(--bg)">74</text>
  <rect x="557" y="198" width="34" height="32" rx="5" fill="var(--str)"/>
  <text x="574.0" y="219" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="var(--bg)">65</text>
  <rect x="596" y="198" width="34" height="32" rx="5" fill="var(--str)"/>
  <text x="613.0" y="219" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="var(--bg)">6d</text>
  <rect x="635" y="198" width="34" height="32" rx="5" fill="var(--str)"/>
  <text x="652.0" y="219" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="var(--bg)">70</text>
  <text x="593.5" y="246" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="var(--str)">"temp"</text>
  <text x="16" y="294" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13"><tspan fill="var(--fg)">unit: </tspan><tspan fill="var(--ty)">Unit</tspan><tspan fill="var(--fg)">,</tspan></text>
  <text x="16" y="274" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13"><tspan fill="var(--attr)">#[serde(rename = </tspan><tspan fill="var(--str)">&quot;_2&quot;</tspan><tspan fill="var(--attr)">)]</tspan></text>
  <text x="182" y="294" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13"><tspan fill="var(--fg-muted)">= </tspan><tspan fill="var(--ty)">Celsius</tspan></text>
  <rect x="390" y="272" width="34" height="32" rx="5" fill="var(--accent)"/>
  <text x="407.0" y="293" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="var(--bg)">43</text>
  <text x="407.0" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="var(--accent)">_2</text>
  <rect x="454" y="272" width="34" height="32" rx="5" fill="var(--ty)"/>
  <text x="471.0" y="293" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="var(--bg)">01</text>
  <rect x="518" y="272" width="34" height="32" rx="5" fill="var(--str)"/>
  <text x="535.0" y="293" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="var(--bg)">41</text>
  <text x="535.0" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="var(--str)">variant _0</text>
  <text x="0" y="338" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="var(--fg)">}</text>
  <text x="0" y="372" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13"><tspan fill="var(--kw)">enum</tspan><tspan fill="var(--fg)"> </tspan><tspan fill="var(--ty)">Unit</tspan><tspan fill="var(--fg)"> {</tspan></text>
  <text x="31" y="392" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13"><tspan fill="var(--attr)">#[serde(rename = </tspan><tspan fill="var(--str)">&quot;_0&quot;</tspan><tspan fill="var(--attr)">)]</tspan></text>
  <text x="31" y="412" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13"><tspan fill="var(--ty)">Celsius</tspan><tspan fill="var(--fg)">,</tspan></text>
  <text x="31" y="432" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13"><tspan fill="var(--attr)">#[serde(rename = </tspan><tspan fill="var(--str)">&quot;_1&quot;</tspan><tspan fill="var(--attr)">)]</tspan></text>
  <text x="31" y="452" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13"><tspan fill="var(--ty)">Other</tspan><tspan fill="var(--fg)">(</tspan><tspan fill="var(--ty)">String</tspan><tspan fill="var(--fg)">),</tspan></text>
  <text x="0" y="472" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13"><tspan fill="var(--fg)">}</tspan></text>
