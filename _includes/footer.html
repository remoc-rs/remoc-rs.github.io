{%- assign project = site.projects | where: "id", page.project | first %}
{%- unless project %}{% assign project = site.projects | first %}{% endunless %}
<footer>
    <div class="footer-inner">
        <div class="footer-brand">
            <img src="{{ project.logo }}" alt="" width="27" height="28">
            <p>
                {{ project.name }} is free software under the
                <a href="{{ project.repo }}/blob/{{ project.branch }}/LICENSE">Apache&nbsp;2.0 license</a>.
            </p>
        </div>
        <nav aria-label="Footer">
            <ul>
                <li><a href="https://crates.io/crates/{{ project.crate }}">crates.io</a></li>
                <li><a href="{{ project.changelog }}">Changelog</a></li>
                <li><a href="{{ project.repo }}/issues">Issues</a></li>
                <li><a href="/impressum.html">Imprint</a></li>
            </ul>
        </nav>
    </div>
</footer>
