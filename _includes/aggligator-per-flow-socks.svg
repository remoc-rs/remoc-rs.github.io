  <text x="100.0" y="152.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="var(--fg)">alc::Stream</text>
  <text x="100.0" y="173.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="var(--fg-muted)">1 byte stream</text>
  <rect x="760.5" y="44.5" width="199" height="223" rx="12" fill="var(--bg-alt)" stroke="var(--border)"/>
  <text x="860.0" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--fg-muted)">Server</text>
