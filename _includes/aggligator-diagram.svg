  <text x="262" y="193.0" font-family="Inter, system-ui, sans-serif" font-size="14" fill="var(--fg)">USB</text>
  <rect x="380" y="180.0" width="12" height="16" rx="2" fill="var(--accent)"/>
  <rect x="398" y="180.0" width="12" height="16" rx="2" fill="var(--accent)"/>
  <rect x="416" y="180.0" width="12" height="16" rx="2" fill="var(--accent)"/>
  <rect x="434" y="180.0" width="12" height="16" rx="2" fill="var(--accent)"/>
  <rect x="452" y="180.0" width="12" height="16" rx="2" fill="var(--accent)"/>
  <rect x="470" y="180.0" width="12" height="16" rx="2" fill="var(--accent)"/>
  <rect x="488" y="180.0" width="12" height="16" rx="2" fill="var(--accent)"/>
  <path d="M 194,160.0 C 224,160.0 220,188.0 250,188.0" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <path d="M 710,188.0 C 740,188.0 736,160.0 766,160.0" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <rect x="250" y="227.0" width="460" height="34" rx="8" fill="none" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="262" y="249.0" font-family="Inter, system-ui, sans-serif" font-size="14" fill="var(--fg-muted)">Bluetooth</text>
  <text x="380" y="248.0" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="var(--fg-muted)">gone — its share moved to the others</text>
  <path d="M 194,160.0 C 224,160.0 220,244.0 250,244.0" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M 710,244.0 C 740,244.0 736,160.0 766,160.0" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="480.0" y="302" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--fg-muted)"><tspan font-weight="700" fill="var(--fg)">one</tspan> connection, carried by <tspan font-weight="700" fill="var(--fg)">every</tspan> link that works</text>
  <text x="480.0" y="324" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="var(--fg-muted)">TCP, TLS, WebSockets, USB or Bluetooth, mixed freely and changed while it runs</text>
</svg>
