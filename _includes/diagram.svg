  <rect x="212" y="195.0" width="12" height="18" rx="2" fill="var(--accent)"/>
  <text x="106.0" y="209.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="var(--fg)">RPC client</text>
