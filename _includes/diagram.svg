  <text x="480.0" y="118.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="var(--fg-muted)">chunks of every channel, interleaved</text>
  <text x="480.0" y="194.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--fg-muted)"><tspan font-weight="700" fill="var(--fg)">one</tspan> connection</text>
  <text x="480.0" y="216.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="var(--fg-muted)">TCP, TLS, a WebSocket or anything else that carries bytes</text>
</svg>
