  <rect x="498.4" y="139.0" width="12.4" height="22" rx="2" fill="var(--ty)"/>
  <rect x="514.9" y="139.0" width="12.4" height="22" rx="2" fill="var(--str)"/>
  <rect x="531.3" y="139.0" width="12.4" height="22" rx="2" fill="var(--str)"/>
