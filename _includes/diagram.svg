  <rect x="212" y="141.0" width="12" height="18" rx="2" fill="var(--str)"/>
  <text x="114.0" y="155.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="var(--fg)">watch::Receiver</text>
  <rect x="726" y="131.0" width="218" height="38" rx="8" fill="none" stroke="var(--str)" stroke-width="1.5"/>
  <rect x="736" y="141.0" width="12" height="18" rx="2" fill="var(--str)"/>
  <text x="846.0" y="155.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="var(--fg)">watch::Sender</text>
  <path d="M 234,150.0 C 309,150.0 305,150.0 360,150.0" fill="none" stroke="var(--str)" stroke-width="2"/>
