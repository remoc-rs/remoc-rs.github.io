<svg viewBox="0 0 960 300" role="img" aria-labelledby="diagram-title diagram-desc"
     xmlns="http://www.w3.org/2000/svg" class="diagram-svg">
  <title id="diagram-title">How Remoc uses one connection</title>
  <desc id="diagram-desc">Two programs, each holding senders and receivers with their own queue of messages: an mpsc sender sending to the right, a watch receiver fed from the right, and an RPC client calling an RPC server. All of them join into a single connection in the middle, which carries their chunks interleaved.</desc>
  <rect x="0.5" y="30.5" width="249" height="239" rx="12" fill="var(--bg-alt)" stroke="var(--border)"/>
  <text x="125.0" y="20" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--fg-muted)">Local endpoint</text>
  <rect x="710.5" y="30.5" width="249" height="239" rx="12" fill="var(--bg-alt)" stroke="var(--border)"/>
  <text x="835.0" y="20" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--fg-muted)">Remote endpoint</text>
  <rect x="16" y="77.0" width="218" height="38" rx="8" fill="none" stroke="var(--ty)" stroke-width="1.5"/>
  <rect x="180" y="87.0" width="12" height="18" rx="2" fill="var(--ty)"/>
  <rect x="196" y="87.0" width="12" height="18" rx="2" fill="var(--ty)"/>
  <rect x="212" y="87.0" width="12" height="18" rx="2" fill="var(--ty)"/>
  <text x="98.0" y="101.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="var(--fg)">mpsc::Sender</text>
  <rect x="726" y="77.0" width="218" height="38" rx="8" fill="none" stroke="var(--ty)" stroke-width="1.5"/>
  <rect x="736" y="87.0" width="12" height="18" rx="2" fill="var(--ty)"/>
  <rect x="752" y="87.0" width="12" height="18" rx="2" fill="var(--ty)"/>
  <rect x="768" y="87.0" width="12" height="18" rx="2" fill="var(--ty)"/>
  <text x="862.0" y="101.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="var(--fg)">mpsc::Receiver</text>
  <path d="M 234,96.0 C 309,96.0 305,150.0 360,150.0" fill="none" stroke="var(--ty)" stroke-width="2"/>
  <path d="M 600,150.0 C 655,150.0 651,96.0 726,96.0" fill="none" stroke="var(--ty)" stroke-width="2"/>
<path d="M 719,91.0 L 726,96.0 L 719,101.0 Z" fill="var(--ty)"/>
