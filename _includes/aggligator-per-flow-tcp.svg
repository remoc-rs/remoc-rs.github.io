<svg viewBox="0 0 960 296" role="img" aria-labelledby="pf-tcp-title pf-tcp-desc"
     xmlns="http://www.w3.org/2000/svg" class="diagram-svg">
  <title id="pf-tcp-title">Parallel TCP links over one path</title>
  <desc id="pf-tcp-desc">A client and a server each hold one byte stream. Between them run four separate TCP connections over the same network path, each subject to a per-flow limit, combining their bandwidth into one stream.</desc>
  <rect x="0.5" y="44.5" width="199" height="223" rx="12" fill="var(--bg-alt)" stroke="var(--border)"/>
  <text x="100.0" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--fg-muted)">Client</text>
  <rect x="16" y="125.0" width="168" height="62" rx="8" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="100.0" y="152.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="var(--fg)">alc::Stream</text>
  <text x="100.0" y="173.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="var(--fg-muted)">1 byte stream</text>
  <rect x="760.5" y="44.5" width="199" height="223" rx="12" fill="var(--bg-alt)" stroke="var(--border)"/>
  <text x="860.0" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--fg-muted)">Server</text>
  <rect x="776" y="125.0" width="168" height="62" rx="8" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="860.0" y="152.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" fill="var(--fg)">alc::Stream</text>
  <text x="860.0" y="173.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="var(--fg-muted)">server.example:5800</text>
  <text x="480.0" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--fg-muted)">Same network path — 4 separate TCP flows</text>
